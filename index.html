<title>ポーカー道場</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one felt column (max 760px). Header + sticky tab rail on top; each mode is a flat card-room panel. Deliberately single-theme (dark felt). */
:root {
  --felt: #0a2a24;          /* page ground: deep felt */
  --felt-top: #0f3b33;      /* lighter felt at the top of the page */
  --felt-2: rgba(0,0,0,.18);/* panel */
  --felt-3: rgba(255,255,255,.05); /* hover / inner panel */
  --rail: #0a2a24;          /* header + tab rail */
  --wood: #5a3c1e;          /* table rim */
  --ink: #e9f0ec;           /* body text */
  --ivory: #f3efe4;         /* headings, card faces */
  --muted: #9fbab1;
  --line: #1d5a4d;          /* hairlines */
  --gold: #d9b45a;          /* accent: brass */
  --red: #d9534a;           /* chip red */
  --blue: #4f86d9;
  --green: #57c48a;         /* good */
  --slate: #5f7470;         /* fold */
  --purple: #a06bd6;        /* all-in */
  --paper: #f3efe4;         /* card face */
  --suit-s: #1d1f24; --suit-h: #c8312a; --suit-d: #2563c9; --suit-c: #1f8a4c;
  --font-display: "Dela Gothic One", "Zen Kaku Gothic New", system-ui, sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 14px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--felt); }
body {
  color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
  background: radial-gradient(120% 70% at 50% 0%, var(--felt-top) 0%, var(--felt) 70%) fixed, var(--felt);
  min-height: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--rail); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--gold); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.wrap { max-width: 760px; margin: 0 auto; }

/* header + tab rail */
header.top { max-width: 760px; margin: 0 auto; padding-block: 18px 6px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; }
.logo { font-family: var(--font-display); font-size: 24px; color: var(--ivory); text-decoration: none; white-space: nowrap; letter-spacing: .02em; }
.logo small { font-family: var(--font-num); font-size: 11px; color: var(--gold); letter-spacing: .12em; margin-left: 8px; }
.lv { display: flex; align-items: center; gap: 10px; min-width: 0; font-family: var(--font-num); font-size: 12px; color: var(--muted); }
.lv-badge { border: 1px solid var(--line); padding: 2px 10px; border-radius: 99px; white-space: nowrap; color: var(--ink); }
.xpbar { width: 90px; height: 6px; background: rgba(0,0,0,.35); border-radius: 99px; overflow: hidden; }
.xpbar i { display: block; height: 100%; background: var(--gold); width: 0; transition: width .5s; }
.streak { white-space: nowrap; }
.streak b { color: var(--gold); font-weight: 600; }
nav.rail { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--rail); margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 18px; padding: 8px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); }
nav.rail .in { max-width: 760px; margin: 0 auto; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
nav.rail .in::-webkit-scrollbar { display: none; }
nav.rail a { flex: 1 0 auto; text-align: center; color: var(--muted); text-decoration: none; padding: 8px 12px; border-radius: 10px; font-weight: 700; font-size: 14px; white-space: nowrap; }
nav.rail a[aria-current="page"] { background: var(--gold); color: #2a1f05; }

/* chips (pure CSS) */
.chip { display: inline-block; position: relative; border-radius: 50%; background: repeating-conic-gradient(var(--c, var(--red)) 0 30deg, var(--ivory) 30deg 45deg); }
.chip::after { content: ""; position: absolute; inset: 22%; border-radius: 50%; background: var(--c, var(--red)); }
h1, h2, h3 { font-weight: 400; text-wrap: balance; line-height: 1.35; margin: 0; color: var(--ivory); }
h1, h2 { font-family: var(--font-display); }
h1 { font-size: clamp(24px, 6vw, 32px); }
h2 { font-size: 20px; }
h3 { font-size: 16px; font-weight: 700; color: var(--gold); }
.eyebrow { font-family: var(--font-num); font-size: 11px; letter-spacing: .12em; color: var(--gold); text-transform: uppercase; }
.muted { color: var(--muted); }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* panels */
.panel { background: var(--felt-2); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.table {
  border-radius: 999px / 110px; padding: 22px 18px; text-align: center;
  background: radial-gradient(ellipse at 50% 40%, #1d5a4d, var(--felt-top) 75%);
  border: 6px solid var(--wood); box-shadow: inset 0 0 0 2px rgba(255,255,255,.06);
}
.table .pot { font-family: var(--font-num); font-size: 13px; color: var(--ivory); background: rgba(0,0,0,.3); display: inline-block; padding: 2px 10px; border-radius: 99px; }
.board { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; min-height: 64px; align-items: center; margin: 10px 0; }

/* playing cards */
.pc { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; width: 44px; height: 62px; border-radius: 8px; background: var(--paper); color: var(--suit-s); box-shadow: 0 2px 0 rgba(0,0,0,.35); font-family: var(--font-num); line-height: 1; animation: deal .3s ease-out both; }
.pc b { font-size: 21px; font-weight: 600; }
.pc i { font-style: normal; font-size: 19px; }
.pc.h { color: var(--suit-h); } .pc.d { color: var(--suit-d); } .pc.c { color: var(--suit-c); }
.pc.big { width: 56px; height: 78px; } .pc.big b { font-size: 26px; } .pc.big i { font-size: 22px; }
.pc.sm { width: 30px; height: 42px; border-radius: 6px; } .pc.sm b { font-size: 15px; } .pc.sm i { font-size: 13px; }
.pc.back { background: repeating-linear-gradient(45deg, #b8423a 0 4px, #8f2f29 4px 8px); border: 3px solid var(--paper); }
@keyframes deal { from { transform: translateY(-6px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .pc, .pop { animation: none !important; } * { transition: none !important; } }
.hand { display: flex; gap: 6px; justify-content: center; }

/* buttons */
.btn { appearance: none; border: 0; cursor: pointer; border-radius: 12px; padding: 11px 16px; font-weight: 700; font-size: 15px; background: var(--ivory); color: #14231f; transition: filter .15s, transform .08s; min-height: 44px; }
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: translateY(1px); }
.btn.gold { background: var(--gold); color: #2a1f05; }
.btn.red { background: var(--red); color: #fff; }
.btn.blue { background: var(--ivory); color: #14231f; }
.btn.slate { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.small { min-height: 34px; padding: 6px 12px; font-size: 13px; }
.btn[disabled] { opacity: .45; cursor: default; }
.btn.right { background: var(--green) !important; color: #062014 !important; opacity: 1 !important; border-color: var(--green); }
.btn.wrong { background: #e2675d !important; color: #fff !important; opacity: 1 !important; border-color: #e2675d; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.back { font-size: 13px; color: var(--muted); background: none; border: 0; cursor: pointer; padding: 6px 0; }

/* lobby */
.hero { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; }
.hero .hand .pc:first-child { transform: rotate(-6deg); } .hero .hand .pc:last-child { transform: rotate(6deg); margin-left: -12px; }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.mode { text-align: left; display: flex; flex-direction: column; gap: 6px; cursor: pointer; border: 1px solid var(--line); background: var(--felt-2); border-radius: var(--r); padding: 16px; transition: background .15s, border-color .15s; color: var(--ink); }
.mode:hover { background: var(--felt-3); border-color: var(--gold); }
.mode .top { display: flex; align-items: center; gap: 10px; }
.mode .chip { width: 26px; height: 26px; flex: none; }
.mode h3 { font-size: 17px; color: var(--ivory); }
.mode p { margin: 0; font-size: 13px; color: var(--muted); }
.mode .meter { font-family: var(--font-num); font-size: 12px; color: var(--gold); margin-top: auto; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--felt-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; }
.stat .v { font-family: var(--font-num); font-size: 22px; font-weight: 600; color: var(--ivory); }
.stat .k { font-size: 11px; line-height: 1.4; color: var(--muted); }


/* tabs */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { border: 1px solid var(--line); background: transparent; border-radius: 99px; padding: 6px 14px; cursor: pointer; font-size: 14px; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--ivory); color: #14231f; border-color: var(--gold); font-weight: 700; }

/* seats */
.seats { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.seat { font-family: var(--font-num); font-size: 11px; padding: 3px 8px; border-radius: 6px; background: rgba(0,0,0,.3); color: var(--muted); }
.seat.me { background: var(--gold); color: #2a1f05; font-weight: 700; }
.seat.opp { background: var(--red); color: #fff; }
.seat.out { opacity: .4; text-decoration: line-through; }

/* feedback */
.fb { border-radius: 12px; padding: 14px; border: 2px solid var(--line); background: rgba(0,0,0,.2); }
.fb.ok { border-color: var(--green); }
.fb.ng { border-color: var(--red); }
.fb .verdict { font-family: var(--font-display); font-size: 22px; }
.fb.ok .verdict { color: var(--green); } .fb.ng .verdict { color: var(--red); }
.fb p { margin: 6px 0; }
.pop { animation: pop .35s ease-out; }
@keyframes pop { 0% { transform: scale(.92); opacity: 0; } 70% { transform: scale(1.02); } 100% { transform: none; opacity: 1; } }

/* 13x13 grid */
.gridwrap { overflow-x: auto; }
.grid { display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 2px; min-width: 300px; max-width: 520px; margin: 0 auto; user-select: none; }
.cell { aspect-ratio: 1; border-radius: 3px; font-family: var(--font-num); font-size: clamp(8.5px, 2.55vw, 13px); font-weight: 700; letter-spacing: -.04em; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.35); color: rgba(244,236,216,.85); cursor: pointer; border: 0; padding: 0; line-height: 1; position: relative; }
.cell.on { color: #0b0b0b; }
.cell sub { font-size: .62em; vertical-align: baseline; margin-left: 1px; opacity: .8; }
.guide { font-size: 14px; margin-top: 8px; color: var(--ink); }
.guide summary { cursor: pointer; color: var(--gold); font-weight: 700; }
.guide ul, ul.plain { margin: 6px 0 0; padding-left: 18px; font-size: 14px; line-height: 1.7; }
.good { color: var(--green); } .bad { color: var(--red); } b.big { font-size: 18px; }
.sdesc { display: block; font-size: 12px; color: var(--muted); line-height: 1.5; }
.cell.hl { outline: 2px solid #fff; outline-offset: 1px; z-index: 1; animation: pulse 1s ease-in-out infinite alternate; }
@keyframes pulse { to { outline-color: var(--gold); } }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 14px; justify-content: center; margin-top: 8px; }
.legend span::before { content: ""; display: inline-block; width: 13px; height: 13px; border-radius: 2px; background: var(--c); margin-right: 5px; vertical-align: -1px; }

/* forms */
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
input[type=text], input[type=number], select, textarea { background: rgba(0,0,0,.35); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; color: var(--ink); min-width: 0; width: 100%; font-family: var(--font-num); font-size: 14px; }
textarea { resize: vertical; min-height: 64px; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
input[type=range] { width: 100%; accent-color: var(--gold); }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.sizes { display: flex; flex-wrap: wrap; gap: 6px; }
.sizes label { border: 1px solid var(--line); border-radius: 99px; padding: 4px 10px; font-family: var(--font-num); font-size: 13px; cursor: pointer; }
.sizes input { display: none; }
.sizes label:has(input:checked) { background: var(--ivory); color: #14231f; border-color: var(--gold); }

/* bars */
.bars { display: flex; flex-direction: column; gap: 8px; }
.bar { display: grid; grid-template-columns: minmax(0, 7em) 1fr 4.5em; gap: 8px; align-items: center; font-size: 13px; }
.bar .track { height: 16px; background: rgba(0,0,0,.35); border-radius: 4px; overflow: hidden; display: flex; }
.bar .track i { display: block; height: 100%; }
.bar .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mix { height: 18px; display: flex; border-radius: 4px; overflow: hidden; background: rgba(0,0,0,.35); }
.mix i { display: block; height: 100%; }
.progress { height: 8px; background: #000; border-radius: 4px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--gold); width: 0; transition: width .2s; }

/* learn */
details.ch { background: var(--felt-2); border: 1px solid var(--line); border-radius: 12px; padding: 4px 16px; }
details.ch summary { cursor: pointer; padding: 10px 0; display: flex; gap: 10px; align-items: center; list-style: none; }
details.ch summary::-webkit-details-marker { display: none; }
details.ch summary .lvl { font-size: 11px; font-family: var(--font-display); padding: 1px 6px; border-radius: 4px; background: rgba(0,0,0,.3); color: var(--muted); flex: none; }
details.ch[open] summary { color: var(--gold); }
.prose { max-width: 65ch; }
.formula { font-family: var(--font-num); background: rgba(0,0,0,.35); border-left: 3px solid var(--gold); padding: 10px 12px; border-radius: 6px; margin: 8px 0; font-size: 14px; overflow-x: auto; }
.key { color: var(--gold); font-weight: 700; }
dl.gl { display: grid; grid-template-columns: minmax(0, 9em) 1fr; gap: 6px 14px; margin: 0; }
dl.gl dt { font-weight: 700; color: var(--gold); } dl.gl dd { margin: 0; color: var(--ink); }
@media (max-width: 480px) { .hero { grid-template-columns: 1fr; } .hero .hand { justify-content: flex-start; order: -1; } h1 { white-space: nowrap; } dl.gl { grid-template-columns: 1fr; } dl.gl dd { margin-bottom: 8px; } .xpbar { width: 60px; } .logo span { display: none; } }
.src li { margin-bottom: 10px; }
.src .note { display: block; font-size: 13px; color: var(--muted); }

/* scenario list */
.slist { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.sitem { text-align: left; cursor: pointer; background: var(--felt-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; color: var(--ink); display: flex; flex-direction: column; gap: 4px; }
.sitem:hover { background: var(--felt-3); }
.sitem .tag { font-size: 11px; color: var(--gold); font-family: var(--font-display); }
.sitem .done { font-size: 11px; color: var(--green); }

/* modal */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 20; display: flex; align-items: flex-end; justify-content: center; padding: 0 max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px)); }
.modal .sheet { background: var(--felt-2); border: 1px solid var(--line); border-radius: 16px 16px 0 0; width: 100%; max-width: 620px; max-height: 92vh; overflow: auto; padding: 16px; }
@media (min-width: 640px) { .modal { align-items: center; } .modal .sheet { border-radius: 16px; } }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ivory); color: #14231f; font-family: var(--font-num); font-weight: 600; font-size: 13px; padding: 7px 16px; border-radius: 99px; z-index: 30; box-shadow: 0 6px 20px rgba(0,0,0,.35); pointer-events: none; animation: pop .3s; }
.detail { font-family: var(--font-num); font-size: 14px; color: var(--ink); line-height: 1.6; }
.detail th { color: var(--gold); font-weight: 700; }
.detail table { border-collapse: collapse; width: 100%; }
.detail td, .detail th { padding: 6px 6px; border-bottom: 1px solid var(--line); text-align: right; }
.detail td:first-child, .detail th:first-child { text-align: left; }
.crumbs { display: flex; flex-wrap: wrap; gap: 4px; font-size: 12px; }
.crumbs button { background: rgba(0,0,0,.3); border: 0; border-radius: 6px; padding: 3px 8px; cursor: pointer; color: var(--ink); }
.note-box { font-size: 13px; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; }

/* play table */
.ptable { position: relative; width: 100%; height: clamp(420px, 118vw, 560px); max-height: 560px; }
.ptable .felt { position: absolute; inset: 14% 6% 16%; border-radius: 50% / 42%; background: radial-gradient(ellipse at 50% 40%, #1d5a4d, var(--felt-top) 75%); border: 6px solid var(--wood); box-shadow: inset 0 0 0 2px rgba(255,255,255,.06); }
.ptable .center { position: absolute; left: 50%; top: 47%; transform: translate(-50%, -50%); text-align: center; width: 70%; }
.ptable .center .board { min-height: 0; margin: 0 0 6px; gap: 4px; }
.ptable .center .pc { width: 34px; height: 48px; } .ptable .center .pc b { font-size: 17px; } .ptable .center .pc i { font-size: 15px; }
.seatbox { position: absolute; transform: translate(-50%, -50%); background: rgba(10,42,36,.95); border: 1px solid var(--line); border-radius: 10px; padding: 5px 7px; min-width: 84px; max-width: 30%; text-align: center; font-size: 11px; line-height: 1.3; transition: opacity .2s, box-shadow .2s; z-index: 2; }
.seatbox .who { display: flex; gap: 4px; align-items: center; justify-content: center; flex-wrap: wrap; }
.seatbox .who b { font-weight: 700; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 6em; }
.seatbox .hand { gap: 2px; margin: 3px 0; }
.seatbox .pc.sm { width: 26px; height: 36px; } .seatbox .pc.sm b { font-size: 13px; } .seatbox .pc.sm i { font-size: 11px; }
.seatbox .stk { color: var(--muted); }
.seatbox.folded { opacity: .45; }
.seatbox.acting { box-shadow: 0 0 0 2px var(--gold), 0 0 18px rgba(242,193,78,.45); }
.seatbox.winner { box-shadow: 0 0 0 2px var(--green), 0 0 18px rgba(59,178,115,.5); }
.seatbox .lastact { font-weight: 700; color: var(--gold); }
.seatbox .betchip { position: absolute; left: 50%; transform: translateX(-50%); bottom: -20px; font-family: var(--font-num); font-size: 11px; background: rgba(0,0,0,.55); border-radius: 99px; padding: 1px 7px; white-space: nowrap; display: flex; gap: 4px; align-items: center; }
.posb { font-family: var(--font-num); font-size: 9px; background: rgba(255,255,255,.12); padding: 0 4px; border-radius: 4px; }
.posb.dealer { background: var(--ink); color: #111; }
.lvl-fish, .lvl-reg, .lvl-pro { font-size: 9px; padding: 0 4px; border-radius: 4px; color: #111; font-weight: 700; }
.lvl-fish { background: var(--green); } .lvl-reg { background: var(--gold); } .lvl-pro { background: var(--red); color: #fff; }
.actpanel { position: sticky; bottom: env(safe-area-inset-bottom, 0px); z-index: 5; }
.actpanel .sizes .btn { min-height: 34px; }
.pill { font-size: 11px; padding: 1px 8px; border-radius: 99px; font-family: var(--font-body); white-space: nowrap; }
.pill.ok { background: rgba(59,178,115,.2); color: var(--green); } .pill.high, .pill.low { background: rgba(229,88,79,.2); color: var(--red); } .pill.muted { color: var(--muted); }
.leak { border-left: 4px solid var(--red); }
details.ch summary .row { flex: none; }

/* basics course */
.dots { display: flex; gap: 6px; flex-wrap: wrap; }
.dot { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--muted); font-family: var(--font-num); font-size: 12px; cursor: pointer; padding: 0; }
.dot.done { background: rgba(87,196,138,.2); color: var(--green); border-color: var(--green); }
.dot.on { background: var(--gold); color: #2a1f05; border-color: var(--gold); }
.dot[disabled] { opacity: .4; cursor: default; }
.hint { background: rgba(217,180,90,.1); border-left: 3px solid var(--gold); border-radius: 6px; padding: 8px 10px; font-size: 14px; }
.course-card.weak { border-color: var(--gold); background: rgba(217,180,90,.08); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--gold); text-decoration: underline; cursor: pointer; font: inherit; }

/* tap-to-pick equity calculator */
.slotrow { display: grid; grid-template-columns: 52px 1fr; gap: 10px; align-items: center; }
.slotrow .lbl { font-size: 13px; color: var(--muted); font-weight: 700; }
.slotrow .hand { justify-content: flex-start; }
.slot { background: none; border: 0; padding: 0; cursor: pointer; border-radius: 7px; }
.slot.active { outline: 2px solid var(--gold); outline-offset: 2px; }
.pc.empty { background: transparent; border: 1.5px dashed var(--line); box-shadow: none; color: var(--muted); font-size: 16px; }
.picker { display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 3px; }
.pk { border: 0; border-radius: 4px; background: var(--paper); color: var(--suit-s); font-family: var(--font-num); font-weight: 600; font-size: 12px; padding: 6px 0; line-height: 1.15; cursor: pointer; letter-spacing: -.04em; }
.pk.h { color: var(--suit-h); } .pk.d { color: var(--suit-d); } .pk.c { color: var(--suit-c); }
.pk:disabled { opacity: .18; cursor: default; }

/* assist panel */
details.assist { background: rgba(217,180,90,.07); border: 1px solid rgba(217,180,90,.45); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; }
details.assist > summary { cursor: pointer; font-weight: 700; color: var(--gold); }
.astep { display: grid; grid-template-columns: 24px 1fr; gap: 8px; align-items: start; font-size: 14px; }
.astep .an { width: 22px; height: 22px; border-radius: 50%; background: var(--gold); color: #2a1f05; font-family: var(--font-num); font-size: 12px; font-weight: 600; display: grid; place-items: center; margin-top: 2px; }
.af { font-family: var(--font-num); font-size: 13.5px; line-height: 1.6; }
.af .muted { font-family: var(--font-body); font-size: 12px; margin-left: 4px; }
details.averdict { border-top: 1px dashed var(--line); padding-top: 6px; }
details.averdict > summary { cursor: pointer; color: var(--ivory); font-weight: 700; font-size: 14px; }
.cmp { display: grid; gap: 4px; }
.cmp-h { font-size: 14px; }
.cmp .bar { grid-template-columns: minmax(0, 6.5em) 1fr 5.5em; }
footer { margin-top: 30px; font-size: 12px; color: var(--muted); text-align: center; }
