<title>ポーカー道場</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=JetBrains+Mono:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: a card-room HUD. Sticky status bar on top, one column of "tables" (panels) on green felt, max 780px. */
:root {
  --felt: #0c2e23;          /* page ground: deep table felt */
  --felt-2: #123d2f;        /* raised felt panel */
  --felt-3: #18503d;        /* hover / inner panel */
  --rail: #08201a;          /* dark rail around tables */
  --ink: #f4ecd8;           /* warm ivory text */
  --muted: #a7c2b3;         /* secondary text */
  --line: rgba(244, 236, 216, .14);
  --gold: #f2c14e;          /* accent: gold chip */
  --red: #e5584f;           /* chip red */
  --blue: #4a8be8;          /* chip blue */
  --green: #3bb273;         /* correct */
  --slate: #66788a;         /* fold */
  --purple: #a45ee0;        /* all-in */
  --paper: #fbf8f1;         /* card face */
  --suit-s: #1d1d1f; --suit-h: #d23b3b; --suit-d: #2c6ed5; --suit-c: #23874a;
  --font-display: "DotGothic16", "Hiragino Kaku Gothic ProN", "Yu Gothic", monospace;
  --font-body: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 14px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--felt); }
body {
  color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
  background:
    radial-gradient(ellipse 120% 60% at 50% -10%, rgba(242,193,78,.10), transparent 60%),
    repeating-linear-gradient(45deg, rgba(255,255,255,.012) 0 2px, transparent 2px 6px),
    var(--felt);
  min-height: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--rail); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--gold); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.wrap { max-width: 780px; margin: 0 auto; }

/* HUD */
.hud {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9;
  margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 18px;
  padding: 10px max(16px, env(safe-area-inset-left, 0px));
  background: var(--rail); border-bottom: 2px solid #000; box-shadow: 0 4px 0 rgba(0,0,0,.25);
}
.hud-in { max-width: 780px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.logo { font-family: var(--font-display); font-size: 20px; letter-spacing: .06em; color: var(--gold); text-decoration: none; white-space: nowrap; display: flex; gap: 8px; align-items: center; }
.logo .chip { width: 22px; height: 22px; }
.lv { margin-left: auto; display: flex; align-items: center; gap: 10px; min-width: 0; }
.lv-badge { font-family: var(--font-display); font-size: 13px; background: var(--gold); color: #2a1e00; padding: 2px 8px; border-radius: 6px; white-space: nowrap; }
.xpbar { width: 110px; height: 10px; background: #000; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.xpbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), #ffe08a); width: 0; transition: width .5s; }
.streak { font-family: var(--font-num); font-size: 12px; color: var(--muted); white-space: nowrap; }
.streak b { color: var(--red); }

/* chips (pure CSS): striped edge + dashed inlay */
.chip { display: inline-block; position: relative; border-radius: 50%; background: repeating-conic-gradient(var(--c, var(--red)) 0 30deg, #fff 30deg 45deg); box-shadow: 0 2px 0 rgba(0,0,0,.4); }
.chip::after { content: ""; position: absolute; inset: 20%; border-radius: 50%; background: var(--c, var(--red)); border: 1px dashed rgba(255,255,255,.6); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; text-wrap: balance; line-height: 1.3; margin: 0; }
h1 { font-size: clamp(28px, 7vw, 42px); letter-spacing: .04em; }
h2 { font-size: 22px; letter-spacing: .04em; }
h3 { font-size: 17px; }
.eyebrow { font-family: var(--font-display); font-size: 12px; letter-spacing: .18em; color: var(--gold); text-transform: uppercase; }
.muted { color: var(--muted); }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* panels = tables */
.panel { background: var(--felt-2); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: 0 6px 0 var(--rail); min-width: 0; }
.table {
  border-radius: 999px / 120px; padding: 22px 18px; text-align: center;
  background: radial-gradient(ellipse at 50% 40%, #1f6b4f, #134634 70%);
  border: 10px solid #3a2414; box-shadow: inset 0 0 0 2px rgba(0,0,0,.35), inset 0 10px 30px rgba(0,0,0,.35), 0 6px 0 var(--rail);
}
.table .pot { font-family: var(--font-num); font-size: 13px; color: var(--ink); background: rgba(0,0,0,.35); display: inline-block; padding: 2px 10px; border-radius: 99px; }
.board { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; min-height: 64px; align-items: center; margin: 10px 0; }

/* playing cards */
.pc { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; width: 44px; height: 62px; border-radius: 7px; background: var(--paper); color: var(--suit-s); box-shadow: 0 3px 0 rgba(0,0,0,.35); font-family: var(--font-num); line-height: 1; animation: deal .35s ease-out both; }
.pc b { font-size: 22px; font-weight: 700; }
.pc i { font-style: normal; font-size: 20px; }
.pc.h { color: var(--suit-h); } .pc.d { color: var(--suit-d); } .pc.c { color: var(--suit-c); }
.pc.big { width: 58px; height: 82px; } .pc.big b { font-size: 28px; } .pc.big i { font-size: 26px; }
.pc.sm { width: 30px; height: 42px; border-radius: 5px; } .pc.sm b { font-size: 15px; } .pc.sm i { font-size: 13px; }
.pc.back { background: repeating-linear-gradient(45deg, var(--red) 0 4px, #a63a33 4px 8px); border: 3px solid var(--paper); }
@keyframes deal { from { transform: translateY(-12px) rotate(-4deg); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .pc, .pop { animation: none !important; } * { transition: none !important; } }
.hand { display: flex; gap: 6px; justify-content: center; }

/* buttons */
.btn { appearance: none; border: 0; cursor: pointer; border-radius: 10px; padding: 11px 16px; font-weight: 700; background: var(--felt-3); color: var(--ink); box-shadow: 0 4px 0 var(--rail); transition: transform .08s, box-shadow .08s, background .15s; min-height: 44px; }
.btn:hover { background: #1f6049; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--rail); }
.btn.gold { background: var(--gold); color: #2a1e00; box-shadow: 0 4px 0 #9a7622; }
.btn.red { background: var(--red); color: #fff; box-shadow: 0 4px 0 #8e2f29; }
.btn.blue { background: var(--blue); color: #fff; box-shadow: 0 4px 0 #2a5498; }
.btn.slate { background: var(--slate); color: #fff; box-shadow: 0 4px 0 #3d4954; }
.btn.ghost { background: transparent; box-shadow: none; border: 1px solid var(--line); }
.btn.small { min-height: 34px; padding: 6px 12px; font-size: 13px; }
.btn[disabled] { opacity: .45; cursor: default; }
.btn.right { outline: 3px solid var(--green); }
.btn.wrong { outline: 3px solid var(--red); opacity: .8; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.back { font-size: 13px; color: var(--muted); background: none; border: 0; cursor: pointer; padding: 6px 0; }

/* lobby */
.hero { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; }
.hero .hand .pc { transform-origin: bottom center; }
.hero .hand .pc:first-child { transform: rotate(-8deg); } .hero .hand .pc:last-child { transform: rotate(8deg); margin-left: -14px; }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.mode { text-align: left; display: flex; flex-direction: column; gap: 6px; cursor: pointer; border: 1px solid var(--line); background: var(--felt-2); border-radius: var(--r); padding: 16px; box-shadow: 0 6px 0 var(--rail); transition: transform .12s, background .15s; color: var(--ink); }
.mode:hover { transform: translateY(-2px); background: var(--felt-3); }
.mode .top { display: flex; align-items: center; gap: 10px; }
.mode .chip { width: 30px; height: 30px; flex: none; }
.mode h3 { font-size: 18px; }
.mode p { margin: 0; font-size: 13px; color: var(--muted); }
.mode .meter { font-family: var(--font-num); font-size: 12px; color: var(--gold); margin-top: auto; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: rgba(0,0,0,.2); border-radius: 10px; padding: 10px; text-align: center; }
.stat .v { font-family: var(--font-num); font-size: 22px; color: var(--gold); }
.stat .k { font-size: 11px; line-height: 1.4; color: var(--muted); letter-spacing: .08em; }

/* tabs */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { border: 1px solid var(--line); background: transparent; border-radius: 99px; padding: 6px 14px; cursor: pointer; font-size: 14px; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--gold); color: #2a1e00; border-color: var(--gold); font-weight: 700; }

/* seats */
.seats { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.seat { font-family: var(--font-num); font-size: 11px; padding: 3px 8px; border-radius: 6px; background: rgba(0,0,0,.3); color: var(--muted); }
.seat.me { background: var(--gold); color: #2a1e00; font-weight: 700; }
.seat.opp { background: var(--red); color: #fff; }
.seat.out { opacity: .4; text-decoration: line-through; }

/* feedback */
.fb { border-radius: 12px; padding: 14px; border: 2px solid var(--line); background: rgba(0,0,0,.2); }
.fb.ok { border-color: var(--green); }
.fb.ng { border-color: var(--red); }
.fb .verdict { font-family: var(--font-display); font-size: 22px; }
.fb.ok .verdict { color: var(--green); } .fb.ng .verdict { color: var(--red); }
.fb p { margin: 6px 0; }
.pop { animation: pop .35s ease-out; }
@keyframes pop { 0% { transform: scale(.92); opacity: 0; } 70% { transform: scale(1.02); } 100% { transform: none; opacity: 1; } }

/* 13x13 grid */
.gridwrap { overflow-x: auto; }
.grid { display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 2px; min-width: 300px; max-width: 520px; margin: 0 auto; user-select: none; }
.cell { aspect-ratio: 1; border-radius: 3px; font-family: var(--font-num); font-size: clamp(7px, 2.1vw, 11px); display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.35); color: rgba(244,236,216,.55); cursor: pointer; border: 0; padding: 0; line-height: 1; position: relative; }
.cell.on { color: #101010; font-weight: 700; }
.cell.hl { outline: 2px solid #fff; outline-offset: 1px; z-index: 1; animation: pulse 1s ease-in-out infinite alternate; }
@keyframes pulse { to { outline-color: var(--gold); } }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; justify-content: center; margin-top: 8px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--c); margin-right: 5px; vertical-align: -1px; }

/* forms */
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
input[type=text], input[type=number], select, textarea { background: rgba(0,0,0,.35); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; color: var(--ink); min-width: 0; width: 100%; font-family: var(--font-num); font-size: 14px; }
textarea { resize: vertical; min-height: 64px; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
input[type=range] { width: 100%; accent-color: var(--gold); }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.sizes { display: flex; flex-wrap: wrap; gap: 6px; }
.sizes label { border: 1px solid var(--line); border-radius: 99px; padding: 4px 10px; font-family: var(--font-num); font-size: 13px; cursor: pointer; }
.sizes input { display: none; }
.sizes label:has(input:checked) { background: var(--gold); color: #2a1e00; border-color: var(--gold); }

/* bars */
.bars { display: flex; flex-direction: column; gap: 8px; }
.bar { display: grid; grid-template-columns: minmax(0, 7em) 1fr 4.5em; gap: 8px; align-items: center; font-size: 13px; }
.bar .track { height: 16px; background: rgba(0,0,0,.35); border-radius: 4px; overflow: hidden; display: flex; }
.bar .track i { display: block; height: 100%; }
.bar .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mix { height: 18px; display: flex; border-radius: 4px; overflow: hidden; background: rgba(0,0,0,.35); }
.mix i { display: block; height: 100%; }
.progress { height: 8px; background: #000; border-radius: 4px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--gold); width: 0; transition: width .2s; }

/* learn */
details.ch { background: var(--felt-2); border: 1px solid var(--line); border-radius: 12px; padding: 4px 16px; }
details.ch summary { cursor: pointer; padding: 10px 0; display: flex; gap: 10px; align-items: center; list-style: none; }
details.ch summary::-webkit-details-marker { display: none; }
details.ch summary .lvl { font-size: 11px; font-family: var(--font-display); padding: 1px 6px; border-radius: 4px; background: rgba(0,0,0,.3); color: var(--muted); flex: none; }
details.ch[open] summary { color: var(--gold); }
.prose { max-width: 65ch; }
.formula { font-family: var(--font-num); background: rgba(0,0,0,.35); border-left: 3px solid var(--gold); padding: 10px 12px; border-radius: 6px; margin: 8px 0; font-size: 14px; overflow-x: auto; }
.key { color: var(--gold); font-weight: 700; }
dl.gl { display: grid; grid-template-columns: minmax(0, 9em) 1fr; gap: 6px 14px; margin: 0; }
dl.gl dt { font-weight: 700; color: var(--gold); } dl.gl dd { margin: 0; color: var(--ink); }
@media (max-width: 480px) { .hero { grid-template-columns: 1fr; } .hero .hand { justify-content: flex-start; order: -1; } h1 { white-space: nowrap; } dl.gl { grid-template-columns: 1fr; } dl.gl dd { margin-bottom: 8px; } .xpbar { width: 60px; } .logo span { display: none; } }
.src li { margin-bottom: 10px; }
.src .note { display: block; font-size: 13px; color: var(--muted); }

/* scenario list */
.slist { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.sitem { text-align: left; cursor: pointer; background: var(--felt-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; color: var(--ink); display: flex; flex-direction: column; gap: 4px; }
.sitem:hover { background: var(--felt-3); }
.sitem .tag { font-size: 11px; color: var(--gold); font-family: var(--font-display); }
.sitem .done { font-size: 11px; color: var(--green); }

/* modal */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 20; display: flex; align-items: flex-end; justify-content: center; padding: 0 max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px)); }
.modal .sheet { background: var(--felt-2); border: 1px solid var(--line); border-radius: 16px 16px 0 0; width: 100%; max-width: 620px; max-height: 92vh; overflow: auto; padding: 16px; }
@media (min-width: 640px) { .modal { align-items: center; } .modal .sheet { border-radius: 16px; } }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--gold); color: #2a1e00; font-family: var(--font-display); padding: 8px 16px; border-radius: 99px; z-index: 30; box-shadow: 0 4px 0 #9a7622; pointer-events: none; animation: pop .3s; }
.detail { font-family: var(--font-num); font-size: 12px; }
.detail table { border-collapse: collapse; width: 100%; }
.detail td, .detail th { padding: 3px 6px; border-bottom: 1px solid var(--line); text-align: right; }
.detail td:first-child, .detail th:first-child { text-align: left; }
.crumbs { display: flex; flex-wrap: wrap; gap: 4px; font-size: 12px; }
.crumbs button { background: rgba(0,0,0,.3); border: 0; border-radius: 6px; padding: 3px 8px; cursor: pointer; color: var(--ink); }
.note-box { font-size: 13px; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; }

/* play table */
.ptable { position: relative; width: 100%; height: clamp(420px, 118vw, 560px); max-height: 560px; }
.ptable .felt { position: absolute; inset: 14% 6% 16%; border-radius: 50% / 42%; background: radial-gradient(ellipse at 50% 40%, #1f6b4f, #134634 70%); border: 10px solid #3a2414; box-shadow: inset 0 0 0 2px rgba(0,0,0,.35), inset 0 10px 30px rgba(0,0,0,.35), 0 6px 0 var(--rail); }
.ptable .center { position: absolute; left: 50%; top: 47%; transform: translate(-50%, -50%); text-align: center; width: 70%; }
.ptable .center .board { min-height: 0; margin: 0 0 6px; gap: 4px; }
.ptable .center .pc { width: 34px; height: 48px; } .ptable .center .pc b { font-size: 17px; } .ptable .center .pc i { font-size: 15px; }
.seatbox { position: absolute; transform: translate(-50%, -50%); background: rgba(8,32,26,.92); border: 1px solid var(--line); border-radius: 10px; padding: 5px 7px; min-width: 84px; max-width: 30%; text-align: center; font-size: 11px; line-height: 1.3; transition: opacity .2s, box-shadow .2s; z-index: 2; }
.seatbox .who { display: flex; gap: 4px; align-items: center; justify-content: center; flex-wrap: wrap; }
.seatbox .who b { font-weight: 700; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 6em; }
.seatbox .hand { gap: 2px; margin: 3px 0; }
.seatbox .pc.sm { width: 26px; height: 36px; } .seatbox .pc.sm b { font-size: 13px; } .seatbox .pc.sm i { font-size: 11px; }
.seatbox .stk { color: var(--muted); }
.seatbox.folded { opacity: .45; }
.seatbox.acting { box-shadow: 0 0 0 2px var(--gold), 0 0 18px rgba(242,193,78,.45); }
.seatbox.winner { box-shadow: 0 0 0 2px var(--green), 0 0 18px rgba(59,178,115,.5); }
.seatbox .lastact { font-weight: 700; color: var(--gold); }
.seatbox .betchip { position: absolute; left: 50%; transform: translateX(-50%); bottom: -20px; font-family: var(--font-num); font-size: 11px; background: rgba(0,0,0,.55); border-radius: 99px; padding: 1px 7px; white-space: nowrap; display: flex; gap: 4px; align-items: center; }
.posb { font-family: var(--font-num); font-size: 9px; background: rgba(255,255,255,.12); padding: 0 4px; border-radius: 4px; }
.posb.dealer { background: var(--ink); color: #111; }
.lvl-fish, .lvl-reg, .lvl-pro { font-size: 9px; padding: 0 4px; border-radius: 4px; color: #111; font-weight: 700; }
.lvl-fish { background: var(--green); } .lvl-reg { background: var(--gold); } .lvl-pro { background: var(--red); color: #fff; }
.actpanel { position: sticky; bottom: env(safe-area-inset-bottom, 0px); z-index: 5; }
.actpanel .sizes .btn { min-height: 34px; }
.pill { font-size: 11px; padding: 1px 8px; border-radius: 99px; font-family: var(--font-body); white-space: nowrap; }
.pill.ok { background: rgba(59,178,115,.2); color: var(--green); } .pill.high, .pill.low { background: rgba(229,88,79,.2); color: var(--red); } .pill.muted { color: var(--muted); }
.leak { border-left: 4px solid var(--red); }
details.ch summary .row { flex: none; }
footer { margin-top: 30px; font-size: 12px; color: var(--muted); text-align: center; }
</style>

<header class="hud">
  <div class="hud-in">
    <a class="logo" href="#lobby"><i class="chip" style="--c: var(--red)"></i><span>ポーカー道場</span></a>
    <div class="lv">
      <span class="lv-badge" id="lvBadge">Lv.1</span>
      <div class="xpbar" title="次のレベルまで"><i id="xpFill"></i></div>
      <span class="streak">連続正解 <b id="streak">0</b></span>
    </div>
  </div>
</header>

<main class="wrap" id="app"></main>
<footer class="wrap">6人卓・100BBのノーリミット ホールデムが前提。表は公開資料をもとにした簡易版です。計算ラボの数値はこのページ内で実際に計算しています。</footer>
